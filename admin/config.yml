# =============================================================
# A&M Universe · Configuración del panel (Sveltia CMS)
# El panel guarda los cambios en este mismo repositorio de GitHub
# y GitHub Pages vuelve a publicar el sitio solo en 1-2 minutos.
# =============================================================

backend:
  name: github
  repo: Droko1982/a-y-m          # dueño/repositorio
  branch: main
  # ↓↓↓ PASO DEL LOGIN: reemplaza esta URL por la de tu Worker de
  #     Cloudflare "sveltia-cms-auth" (ver PANEL-ADMIN.md, Paso 2).
  base_url: https://REEMPLAZA-CON-TU-WORKER.workers.dev

# Idioma del panel
locale: es

# Dónde se ven los cambios publicados
site_url: https://droko1982.github.io/a-y-m/
display_url: https://droko1982.github.io/a-y-m/

# Carpeta donde se guardan las fotos que se suban (para la Fase 2)
media_folder: assets
public_folder: assets

collections:
  # -------- PRECIOS --------
  - name: precios
    label: "Precios"
    icon: attach_money
    files:
      - name: precios
        label: "Precios de las camisetas"
        file: data/config.json
        description: "Cambia el precio de cada horma. Se actualiza en toda la tienda."
        fields:
          - { name: precio_regular, label: "Precio Regular fit (COP)", widget: number, value_type: int, min: 0, step: 1000 }
          - { name: precio_oversized, label: "Precio Oversized (COP)", widget: number, value_type: int, min: 0, step: 1000 }

  # -------- PRODUCTOS --------
  - name: productos
    label: "Productos"
    icon: checkroom
    files:
      - name: productos
        label: "Camisetas de la tienda"
        file: data/productos.json
        description: "Crea, edita, reordena o marca Agotado. Sube la foto de cada camiseta."
        fields:
          - name: productos
            label: "Productos"
            label_singular: "Producto"
            widget: list
            summary: "{{fields.nombre_es}}"
            fields:
              - { name: id, label: "ID (único, sin espacios)", widget: string, hint: "Ej: coral2. No repetir con otro producto." }
              - { name: imagen, label: "Foto de la camiseta", widget: image, choose_url: false }
              - { name: nombre_es, label: "Nombre (español)", widget: string }
              - { name: nombre_en, label: "Nombre (inglés)", widget: string }
              - { name: desc_es, label: "Descripción (español)", widget: text }
              - { name: desc_en, label: "Descripción (inglés)", widget: text }
              - { name: disponible, label: "¿Disponible? (apagar = Agotado)", widget: boolean, default: true }

  # -------- IMPACTO --------
  - name: impacto
    label: "Impacto"
    icon: volunteer_activism
    files:
      - name: contador
        label: "Contador de impacto"
        file: data/impacto.json
        description: "Total de camisetas vendidas. El contador del sitio calcula el dinero apartado para los animalitos."
        fields:
          - { name: camisetas, label: "Camisetas vendidas (total)", widget: number, value_type: int, min: 0 }
