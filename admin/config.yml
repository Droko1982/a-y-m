  # -------- DATOS LEGALES --------
  - name: negocio
    label: "Datos del negocio"
    icon: storefront
    files:
      - name: negocio
        label: "Datos legales y redes sociales"
        file: data/negocio.json
        description: "Cada campo vacío se ve en la tienda como un hueco [entre corchetes], así que pueden llenarlos poco a poco. Arriba: los datos que en la página de políticas aparecen [entre corchetes] (cuando los cuatro estén completos, el aviso de “Plantilla base” desaparece solo). Abajo: las redes sociales, que salen en el pie de la página."
        fields:
          - { name: razon_social, label: "Razón social o nombre del responsable", widget: string, required: false, hint: "Quien responde por el negocio. Ej: María Pérez o A&M Universe S.A.S." }
          - { name: identificacion, label: "NIT o cédula", widget: string, required: false, hint: "Ej: C.C. 1.094.123.456 · o NIT 901.234.567-8 si hay empresa. Mientras esté vacío, en las políticas se ve [NIT o C.C.]." }
          - { name: dias_envio, label: "Tiempo estimado de envío", widget: string, required: false, hint: "Ej: 2 a 5 días hábiles" }
          - { name: dias_cambio, label: "Plazo para cambios de talla", widget: string, required: false, hint: "Ej: 8 días" }
          - { name: actualizado, label: "Fecha de última actualización", widget: string, required: false, hint: "Ej: marzo de 2027. Si lo dejas vacío queda la fecha actual de la página." }
          - { name: instagram, label: "Instagram", widget: string, required: false, hint: "El usuario (@aymuniverse) o la dirección completa. Aparece en el pie de página." }
          - { name: facebook, label: "Facebook", widget: string, required: false, hint: "El usuario o la dirección completa de la página." }
          - { name: tiktok, label: "TikTok", widget: string, required: false, hint: "El usuario (@aymuniverse) o la dirección completa." }
