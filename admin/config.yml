# =============================================================
# A&M Universe · Configuración del panel (Sveltia CMS)
# El panel guarda los cambios en este mismo repositorio de GitHub
# y GitHub Pages vuelve a publicar el sitio solo en 1-2 minutos.
# =============================================================

backend:
  name: github
  repo: Droko1982/a-y-m          # dueño/repositorio
  branch: main
  # ↓↓↓ PASO DEL LOGIN: reemplaza esta URL por la de tu Worker de
  #     Cloudflare "sveltia-cms-auth" (ver PANEL-ADMIN.md, Paso 2).
  base_url: https://REEMPLAZA-CON-TU-WORKER.workers.dev

# Idioma del panel
locale: es

# Dónde se ven los cambios publicados
site_url: https://droko1982.github.io/a-y-m/
display_url: https://droko1982.github.io/a-y-m/

# Carpeta donde se guardan las fotos que se suban (para la Fase 2)
media_folder: assets
public_folder: assets

collections:
  # -------- PRECIOS --------
  - name: precios
    label: "Precios"
    icon: attach_money
    files:
      - name: precios
        label: "Precios de las camisetas"
        file: data/config.json
        description: "Cambia el precio de cada horma. Se actualiza en toda la tienda."
        fields:
          - { name: precio_regular, label: "Precio Regular fit (COP)", widget: number, value_type: int, min: 0, step: 1000 }
          - { name: precio_oversized, label: "Precio Oversized (COP)", widget: number, value_type: int, min: 0, step: 1000 }

  # -------- PAGOS --------
  - name: pagos
    label: "Pagos"
    icon: account_balance_wallet
    files:
      - name: pagos
        label: "Datos de pago del carrito"
        file: data/pagos.json
        description: "El número o la llave que ve la clienta al elegir cada método de pago. Los datos de la cuenta bancaria son opcionales: mientras estén vacíos, el carrito dice que se coordinan por WhatsApp."
        fields:
          - { name: nequi, label: "Nequi · número", widget: string, required: false }
          - { name: daviplata, label: "Daviplata · número", widget: string, required: false, hint: "Si es el mismo de Nequi, escríbelo igual." }
          - { name: breb, label: "Bre-B · llave", widget: string, required: false, hint: "La llave exacta: celular, @usuario, correo o cédula." }
          - { name: banco, label: "Transferencia · banco", widget: string, required: false, hint: "Ej: Bancolombia. Déjalo vacío si prefieres pasar los datos por WhatsApp." }
          - { name: tipo_cuenta, label: "Transferencia · tipo de cuenta", widget: string, required: false, hint: "Ej: Ahorros o Corriente." }
          - { name: numero_cuenta, label: "Transferencia · número de cuenta", widget: string, required: false }
          - { name: titular, label: "Transferencia · a nombre de", widget: string, required: false }

  # -------- PRODUCTOS --------
  - name: productos
    label: "Productos"
    icon: checkroom
    files:
      - name: productos
        label: "Camisetas de la tienda"
        file: data/productos.json
        description: "Crea, edita, reordena o marca Agotado. Sube la foto de cada camiseta."
        fields:
          - name: productos
            label: "Productos"
            label_singular: "Producto"
            widget: list
            summary: "{{fields.nombre_es}}"
            fields:
              - { name: id, label: "ID (único, sin espacios)", widget: string, hint: "Ej: coral2. No repetir con otro producto." }
              - { name: imagen, label: "Foto de la camiseta", widget: image, choose_url: false }
              - { name: nombre_es, label: "Nombre (español)", widget: string }
              - { name: nombre_en, label: "Nombre (inglés)", widget: string }
              - { name: desc_es, label: "Descripción (español)", widget: text }
              - { name: desc_en, label: "Descripción (inglés)", widget: text }
              - { name: disponible, label: "¿Disponible? (apagar = Agotado)", widget: boolean, default: true }

  # -------- IMPACTO --------
  - name: impacto
    label: "Impacto"
    icon: volunteer_activism
    files:
      - name: contador
        label: "Contador de impacto"
        file: data/impacto.json
        description: "Total de camisetas vendidas. El contador del sitio calcula el dinero apartado para los animalitos."
        fields:
          - { name: camisetas, label: "Camisetas vendidas (total)", widget: number, value_type: int, min: 0 }
          - { name: api, label: "Dirección del contador automático (opcional)", widget: string, required: false, hint: "La URL del Worker de Cloudflare, si ya lo instalaron (ver CONTADOR-MENSAJE-CLIENTAS.md). Vacío = se usa el total escrito arriba." }

  # -------- TEXTOS --------
  - name: contenido
    label: "Textos"
    icon: edit_note
    files:
      - name: textos
        label: "Textos del sitio"
        file: data/textos.json
        description: "Cambia los textos del sitio: portada, colecciones, tienda, Océano, propósito, impacto, preguntas frecuentes y contacto/envíos. Si dejas un campo vacío, el sitio conserva el texto que ya tenía."
        fields:
          # ----- Portada -----
          - name: portada
            label: "Portada"
            widget: object
            collapsed: true
            fields:
              - { name: aviso_es, label: "Aviso de la barra superior (español)", widget: string, required: false }
              - { name: aviso_en, label: "Aviso de la barra superior (inglés)", widget: string, required: false }
              - { name: eyebrow_es, label: "Línea pequeña sobre el título (español)", widget: string, required: false }
              - { name: eyebrow_en, label: "Línea pequeña sobre el título (inglés)", widget: string, required: false }
              - { name: titulo_es, label: "Título grande (español)", widget: string, required: false }
              - { name: titulo_en, label: "Título grande (inglés)", widget: string, required: false }
              - { name: texto_es, label: "Texto bajo el título (español)", widget: text, required: false }
              - { name: texto_en, label: "Texto bajo el título (inglés)", widget: text, required: false }
              - { name: boton1_es, label: "Botón 1 · ver colección (español)", widget: string, required: false }
              - { name: boton1_en, label: "Botón 1 · ver colección (inglés)", widget: string, required: false }
              - { name: boton2_es, label: "Botón 2 · WhatsApp (español)", widget: string, required: false }
              - { name: boton2_en, label: "Botón 2 · WhatsApp (inglés)", widget: string, required: false }

              # ----- Franja de valores (las 4 tarjetas bajo la portada) -----
              - { name: valores_titulo_es, label: "Valores · título para lectores de pantalla (español)", widget: string, required: false }
              - { name: valores_titulo_en, label: "Valores · título para lectores de pantalla (inglés)", widget: string, required: false }
              - { name: valor1_titulo_es, label: "Valor 1 · título (español)", widget: string, required: false }
              - { name: valor1_titulo_en, label: "Valor 1 · título (inglés)", widget: string, required: false }
              - { name: valor1_texto_es, label: "Valor 1 · texto (español)", widget: text, required: false }
              - { name: valor1_texto_en, label: "Valor 1 · texto (inglés)", widget: text, required: false }
              - { name: valor2_titulo_es, label: "Valor 2 · título (español)", widget: string, required: false }
              - { name: valor2_titulo_en, label: "Valor 2 · título (inglés)", widget: string, required: false }
