# =============================================================
# A&M Universe · Configuración del panel (Sveltia CMS)
# El panel guarda los cambios en este mismo repositorio de GitHub
# y GitHub Pages vuelve a publicar el sitio solo en 1-2 minutos.
# =============================================================

backend:
  name: github
  repo: Droko1982/a-y-m          # dueño/repositorio
  branch: main
  # ↓↓↓ PASO DEL LOGIN: reemplaza esta URL por la de tu Worker de
  #     Cloudflare "sveltia-cms-auth" (ver PANEL-ADMIN.md, Paso 2).
  base_url: https://REEMPLAZA-CON-TU-WORKER.workers.dev

# Idioma del panel
locale: es

# El logo de la marca en el panel, para que se sienta suyo y no de la herramienta
logo_url: ../assets/logo-light.png

# Dónde se ven los cambios publicados
site_url: https://droko1982.github.io/a-y-m/
display_url: https://droko1982.github.io/a-y-m/

# Carpeta donde se guardan las fotos que se suban (para la Fase 2)
media_folder: assets
public_folder: assets

# Las fotos que se suban se convierten solas a WebP y se achican a máximo
# 1600 px de lado (la foto de un mockup de 4320 x 5400 px pasaba de 5 MB y en
# el celular no alcanzaba a cargar). Los nombres quedan sin espacios ni tildes.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

collections:
  # -------- PRECIOS --------
  - name: precios
    label: "Precios"
    icon: attach_money
    files:
      - name: precios
        label: "Precios generales"
        file: data/config.json
        description: "El precio general de cada espacio. Se usa para las camisetas que NO tienen precio propio (cada camiseta puede tener el suyo en Productos)."
        fields:
          - { name: precio_regular, label: "Precio general Regular fit (COP)", widget: number, value_type: int, min: 1000, step: 1000, hint: "Puedes escribirlo 75000 o 75.000, las dos formas sirven. Por seguridad se ignora cualquier valor menor a 1.000." }
          - { name: precio_oversized, label: "Precio general Oversized (COP)", widget: number, value_type: int, min: 1000, step: 1000 }
          - { name: precio_esenciales, label: "Precio general Esenciales (COP)", widget: number, value_type: int, min: 1000, step: 1000, required: false, hint: "Si lo dejas vacío, los esenciales usan el precio general de Regular fit." }

  # -------- PAGOS --------
  - name: pagos
    label: "Pagos"
    icon: account_balance_wallet
    files:
      - name: pagos
        label: "Datos de pago del carrito"
        file: data/pagos.json
        description: "El número o la llave que ve la clienta al elegir cada método de pago. Los datos de la cuenta bancaria son opcionales: mientras estén vacíos, el carrito dice que se coordinan por WhatsApp."
        fields:
          - { name: nequi, label: "Nequi · número", widget: string, required: false, hint: "Ej: 321 579 9683. Es el número que ve la clienta al elegir Nequi en el carrito." }
          - { name: daviplata, label: "Daviplata · número", widget: string, required: false, hint: "Si es el mismo de Nequi, escríbelo igual." }
          - { name: breb, label: "Bre-B · llave", widget: string, required: false, hint: "La llave exacta: celular, @usuario, correo o cédula." }
          - { name: banco, label: "Transferencia · banco", widget: string, required: false, hint: "Ej: Bancolombia. Déjalo vacío si prefieres pasar los datos por WhatsApp." }
          - { name: tipo_cuenta, label: "Transferencia · tipo de cuenta", widget: string, required: false, hint: "Ej: Ahorros o Corriente." }
          - { name: numero_cuenta, label: "Transferencia · número de cuenta", widget: string, required: false, hint: "Ej: 912-345678-90. Déjalo vacío si prefieres pasar los datos por WhatsApp." }
          - { name: titular, label: "Transferencia · a nombre de", widget: string, required: false, hint: "El nombre tal como aparece en la cuenta del banco. Ej: Cristina Marín" }

  # -------- PRODUCTOS --------
  - name: productos
    label: "Productos"
    icon: checkroom
    description: "Las camisetas, en tres espacios con diseños distintos: Regular fit, Oversized y Esenciales. La horma la define el espacio donde subas cada camiseta, y la colección (Océano o Felina) se elige en cada una."
    files:
      - name: productos
        label: "Regular fit"
        file: data/productos.json
        description: "Camisetas de horma Regular fit (corte clásico). Crea, edita, reordena o marca Agotado."
        fields:
          - name: productos
            label: "Camisetas"
            label_singular: "Camiseta"
            widget: list
            summary: "{{fields.nombre_es}}"
            # Las camisetas nuevas se agregan arriba (el botón queda arriba) y las
            # que ya están se muestran plegadas, con su foto: no hay que bajar
            # hasta el final de la lista para subir una nueva.
            add_to_top: true
            collapsed: true
            thumbnail: imagen
            fields:
              - { name: id, label: "ID (único, sin espacios)", widget: string, hint: "Ej: origen2. No repetir con ninguna otra camiseta de ningún espacio." }
              - { name: coleccion, label: "Colección", widget: select, default: "oceano", options: [{ label: "Océano", value: "oceano" }, { label: "Felina", value: "felina" }], hint: "En qué colección aparece esta camiseta. Al entrar a esa colección se ve en su pestaña (Regular fit u Oversized)." }
              - { name: imagen, label: "Foto de portada", widget: image, choose_url: false, hint: "La foto que se ve primero, en la tarjeta y en la ventana. Siempre se muestra, aunque haya colores." }
              - { name: galeria, label: "Más fotos (galería)", widget: image, required: false, multiple: true, choose_url: false, hint: "Fotos adicionales de esta camiseta. Se ven en la ventana al hacer clic, y se pasan con las flechas o deslizando. Puedes arrastrar varias a la vez." }
              - name: colores
                label: "Colores (cada uno con su foto) — opcional"
                widget: list
                required: false
                label_singular: "Color"
                summary: "{{fields.nombre_es}}"
                hint: "Si viene en varios colores del MISMO estampado, agrega cada color con su foto. En la tienda salen cuadritos para elegir (opcionales: la portada se ve siempre). El color elegido va en el pedido."
                fields:
                  - { name: nombre_es, label: "Nombre del color", widget: string }
                  - { name: color, label: "Cuadrito de color", widget: color, required: false, hint: "El color del círculo que se toca para elegir. Si lo dejas vacío, se usa una miniatura de la foto." }
                  - { name: imagen, label: "Foto de este color", widget: image, choose_url: false }
                  - { name: galeria, label: "Más fotos de este color", widget: image, required: false, multiple: true, choose_url: false }
              - { name: nombre_es, label: "Nombre", widget: string }
              - { name: precio, label: "Precio de esta camiseta (COP) — opcional", widget: number, required: false, value_type: int, min: 1000, step: 1000, hint: "Si lo dejas vacío, usa el precio general de este espacio (sección Precios). Puedes escribir 59000 o 59.000." }
              - { name: desc_es, label: "Descripción corta", widget: text, hint: "La que se ve en la tarjeta." }
              - { name: desc_larga_es, label: "Descripción ampliada", widget: text, required: false, hint: "La que se ve en la ventana de fotos. Si la dejas vacía, se usa la corta." }
              - { name: disponible, label: "¿Disponible? (apagar = Agotado)", widget: boolean, default: true }

      - name: oversized
        label: "Oversized"
        file: data/oversized.json
        description: "Camisetas de horma Oversized (corte amplio), con sus propios diseños. Mientras esté vacío, en la tienda sale un aviso de 'muy pronto'."
        fields:
          - name: productos
            label: "Camisetas"
            label_singular: "Camiseta"
            widget: list
            summary: "{{fields.nombre_es}}"
            # Las camisetas nuevas se agregan arriba (el botón queda arriba) y las
            # que ya están se muestran plegadas, con su foto: no hay que bajar
            # hasta el final de la lista para subir una nueva.
            add_to_top: true
            collapsed: true
            thumbnail: imagen
            fields:
              - { name: id, label: "ID (único, sin espacios)", widget: string, hint: "Ej: ballena-oversized. No repetir con ninguna otra camiseta de ningún espacio." }
              - { name: coleccion, label: "Colección", widget: select, default: "oceano", options: [{ label: "Océano", value: "oceano" }, { label: "Felina", value: "felina" }], hint: "En qué colección aparece esta camiseta. Al entrar a esa colección se ve en su pestaña (Regular fit u Oversized)." }
              - { name: imagen, label: "Foto de portada", widget: image, choose_url: false, hint: "La foto que se ve primero, en la tarjeta y en la ventana. Siempre se muestra, aunque haya colores." }
              - { name: galeria, label: "Más fotos (galería)", widget: image, required: false, multiple: true, choose_url: false, hint: "Fotos adicionales de esta camiseta. Se ven en la ventana al hacer clic, y se pasan con las flechas o deslizando. Puedes arrastrar varias a la vez." }
              - name: colores
                label: "Colores (cada uno con su foto) — opcional"
                widget: list
                required: false
                label_singular: "Color"
                summary: "{{fields.nombre_es}}"
                hint: "Si viene en varios colores del MISMO estampado, agrega cada color con su foto. En la tienda salen cuadritos para elegir (opcionales: la portada se ve siempre). El color elegido va en el pedido."
                fields:
                  - { name: nombre_es, label: "Nombre del color", widget: string }
                  - { name: color, label: "Cuadrito de color", widget: color, required: false, hint: "El color del círculo que se toca para elegir. Si lo dejas vacío, se usa una miniatura de la foto." }
                  - { name: imagen, label: "Foto de este color", widget: image, choose_url: false }
                  - { name: galeria, label: "Más fotos de este color", widget: image, required: false, multiple: true, choose_url: false }
              - { name: nombre_es, label: "Nombre", widget: string }
              - { name: precio, label: "Precio de esta camiseta (COP) — opcional", widget: number, required: false, value_type: int, min: 1000, step: 1000, hint: "Si lo dejas vacío, usa el precio general de este espacio (sección Precios). Puedes escribir 59000 o 59.000." }
              - { name: desc_es, label: "Descripción corta", widget: text, hint: "La que se ve en la tarjeta." }
              - { name: desc_larga_es, label: "Descripción ampliada", widget: text, required: false, hint: "La que se ve en la ventana de fotos. Si la dejas vacía, se usa la corta." }
              - { name: disponible, label: "¿Disponible? (apagar = Agotado)", widget: boolean, default: true }

      - name: essentials
        label: "Esenciales"
        file: data/essentials.json
        description: "Los básicos: camisetas para usar con todo. Tienen su propia página (Esenciales), con una tarjeta debajo de las colecciones."
        fields:
          - name: productos
            label: "Camisetas"
            label_singular: "Camiseta"
            widget: list
            summary: "{{fields.nombre_es}}"
            # Las camisetas nuevas se agregan arriba (el botón queda arriba) y las
            # que ya están se muestran plegadas, con su foto: no hay que bajar
            # hasta el final de la lista para subir una nueva.
            add_to_top: true
            collapsed: true
            thumbnail: imagen
            fields:
              - { name: id, label: "ID (único, sin espacios)", widget: string, hint: "Ej: ess-gris. No repetir con ninguna otra camiseta de ningún espacio." }
              - { name: imagen, label: "Foto de portada", widget: image, choose_url: false, hint: "La foto que se ve primero, en la tarjeta y en la ventana. Siempre se muestra, aunque haya colores." }
              - { name: galeria, label: "Más fotos (galería)", widget: image, required: false, multiple: true, choose_url: false, hint: "Fotos adicionales de este básico. Se ven en la ventana al hacer clic, y se pasan con las flechas o deslizando. Puedes arrastrar varias a la vez." }
              - name: colores
                label: "Colores (cada uno con su foto) — opcional"
                widget: list
                required: false
                label_singular: "Color"
                summary: "{{fields.nombre_es}}"
                hint: "Si viene en varios colores del MISMO estampado, agrega cada color con su foto. En la tienda salen cuadritos para elegir (opcionales: la portada se ve siempre). El color elegido va en el pedido."
                fields:
                  - { name: nombre_es, label: "Nombre del color", widget: string }
                  - { name: color, label: "Cuadrito de color", widget: color, required: false, hint: "El color del círculo que se toca para elegir. Si lo dejas vacío, se usa una miniatura de la foto." }
                  - { name: imagen, label: "Foto de este color", widget: image, choose_url: false }
                  - { name: galeria, label: "Más fotos de este color", widget: image, required: false, multiple: true, choose_url: false }
              - { name: nombre_es, label: "Nombre", widget: string }
              - { name: precio, label: "Precio de esta camiseta (COP) — opcional", widget: number, required: false, value_type: int, min: 1000, step: 1000, hint: "Si lo dejas vacío, usa el precio general de este espacio (sección Precios). Puedes escribir 59000 o 59.000." }
              - { name: desc_es, label: "Descripción corta", widget: text, hint: "La que se ve en la tarjeta." }
              - { name: desc_larga_es, label: "Descripción ampliada", widget: text, required: false, hint: "La que se ve en la ventana de fotos. Si la dejas vacía, se usa la corta." }
              - { name: disponible, label: "¿Disponible? (apagar = Agotado)", widget: boolean, default: true }

  # -------- GUÍA DE TALLAS --------
  - name: tallas
    label: "Guía de tallas"
    icon: straighten
    files:
      - name: tallas
        label: "Medidas de las camisetas"
        file: data/tallas.json
        description: "La tabla de medidas que sale debajo de las camisetas. Una tabla para Regular fit y otra para Oversized (los Esenciales usan la de Regular fit). Medidas en centímetros."
        fields:
          - { name: nota, label: "Texto sobre las tablas", widget: string, required: false }
          - name: regular
            label: "Regular fit"
            label_singular: "Talla"
            widget: list
            summary: "{{fields.talla}} · pecho {{fields.pecho}} · largo {{fields.largo}} · hombro {{fields.hombro}}"
            fields:
              - { name: talla, label: "Talla", widget: string }
              - { name: pecho, label: "Pecho (cm)", widget: string }
              - { name: largo, label: "Largo (cm)", widget: string }
              - { name: hombro, label: "Hombro (cm)", widget: string }
          - name: oversized
            label: "Oversized"
            label_singular: "Talla"
            widget: list
            summary: "{{fields.talla}} · pecho {{fields.pecho}} · largo {{fields.largo}} · hombro {{fields.hombro}}"
            fields:
              - { name: talla, label: "Talla", widget: string }
              - { name: pecho, label: "Pecho (cm)", widget: string }
              - { name: largo, label: "Largo (cm)", widget: string }
              - { name: hombro, label: "Hombro (cm)", widget: string }

  # -------- IMPACTO --------
  - name: impacto
    label: "Impacto"
    icon: volunteer_activism
    files:
      - name: contador
        label: "Contador de impacto"
        file: data/impacto.json
        description: "Total de camisetas vendidas. El contador del sitio calcula el dinero apartado para los animalitos."
        fields:
          - { name: camisetas, label: "Camisetas vendidas (total)", widget: number, value_type: int, min: 0, hint: "Es el TOTAL acumulado desde el principio, no las de esta semana. Si iban en 12 y vendieron 3, se escribe 15." }
          - { name: api, label: "Dirección del contador automático (opcional)", widget: string, required: false, hint: "La URL del Worker de Cloudflare, si ya lo instalaron (ver CONTADOR-MENSAJE-CLIENTAS.md). Vacío = se usa el total escrito arriba." }

  # -------- TEXTOS --------
  - name: contenido
    label: "Textos"
    icon: edit_note
    files:
      - name: textos
        label: "Textos del sitio"
        file: data/textos.json
        description: "Cambia los textos del sitio: portada, colecciones, tienda, Océano, propósito, impacto, preguntas frecuentes y contacto/envíos. Si dejas un campo vacío, el sitio conserva el texto que ya tenía."
        fields:
          # ----- Portada -----
          - name: portada
            label: "Portada"
            widget: object
            collapsed: true
            fields:
              - { name: aviso_es, label: "Aviso de la barra superior", widget: string, required: false }
              - { name: eyebrow_es, label: "Línea pequeña sobre el título", widget: string, required: false }
              - { name: titulo_es, label: "Título grande", widget: string, required: false }
              - { name: texto_es, label: "Texto bajo el título", widget: text, required: false }
              - { name: boton1_es, label: "Botón 1 · ver colección", widget: string, required: false }
              - { name: boton2_es, label: "Botón 2 · WhatsApp", widget: string, required: false }

              # ----- Franja de valores (las 4 tarjetas bajo la portada) -----
              - { name: valores_titulo_es, label: "Valores · título para lectores de pantalla", widget: string, required: false }
              - { name: valor1_titulo_es, label: "Valor 1 · título", widget: string, required: false }
              - { name: valor1_texto_es, label: "Valor 1 · texto", widget: text, required: false }
              - { name: valor2_titulo_es, label: "Valor 2 · título", widget: string, required: false }
              - { name: valor2_texto_es, label: "Valor 2 · texto", widget: text, required: false }
              - { name: valor3_titulo_es, label: "Valor 3 · título", widget: string, required: false }
              - { name: valor3_texto_es, label: "Valor 3 · texto", widget: text, required: false }
              - { name: valor4_titulo_es, label: "Valor 4 · título", widget: string, required: false }
              - { name: valor4_texto_es, label: "Valor 4 · texto", widget: text, required: false }
          # ----- Colecciones -----
          - name: colecciones
            label: "Colecciones"
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow_es, label: "Línea pequeña de la sección", widget: string, required: false }
              - { name: titulo_es, label: "Título de las camisetas de Océano", widget: string, required: false, hint: "El encabezado grande encima de las camisetas, al entrar a la colección Océano." }
              - { name: portal_titulo_es, label: "Título de la sección Colecciones", widget: string, required: false }
              - { name: portal_texto_es, label: "Portal · primer párrafo", widget: text, required: false }
              - { name: portal_texto2_es, label: "Portal · segundo párrafo", widget: text, required: false }
              - { name: oceano_nombre_es, label: "Océano · nombre", widget: string, required: false }
              - { name: oceano_desc_es, label: "Océano · descripción", widget: text, required: false }
              - { name: oceano_boton_es, label: "Océano · botón", widget: string, required: false }
              - { name: felina_etiqueta_es, label: "Felina · etiqueta", widget: string, required: false }
              - { name: felina_nombre_es, label: "Felina · nombre", widget: string, required: false }
              - { name: felina_desc_es, label: "Felina · descripción", widget: text, required: false }
              - { name: felina_boton_es, label: "Felina · botón", widget: string, required: false }

          # ----- Tienda (camisetas) -----
          - name: tienda
            label: "Tienda (camisetas)"
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow_es, label: "Línea pequeña de la sección", widget: string, required: false }
              - { name: texto_es, label: "Texto de la sección", widget: text, required: false }
              - { name: nota_es, label: "Aviso de fotos de referencia", widget: text, required: false }
              - { name: regular_texto_es, label: "Texto del espacio Regular fit", widget: string, required: false }
              - { name: oversized_texto_es, label: "Texto del espacio Oversized", widget: string, required: false }
              - { name: esenciales_titulo_es, label: "Esenciales · título de su página", widget: string, required: false }
              - { name: esenciales_texto_es, label: "Esenciales · texto (página y tarjeta)", widget: string, required: false }
              - { name: vacio_es, label: "Aviso cuando un espacio aún no tiene camisetas", widget: string, required: false }
              - { name: mostrar_nota, label: "¿Mostrar el aviso de fotos de referencia?", widget: boolean, default: true, required: false, hint: "Apágalo cuando ya estén las fotos reales de las camisetas." }

          # ----- Océano (la historia de la colección) -----
          - name: oceano
            label: "Océano (la historia de la colección)"
            widget: object
            collapsed: true
            fields:
              # ----- Portada de la colección (lo primero que se ve al entrar) -----
              - { name: portada_eyebrow_es, label: "Portada · línea pequeña", widget: string, required: false }
              - { name: portada_titulo_es, label: "Portada · nombre de la colección", widget: string, required: false, hint: "Es el título grande sobre el video. Si renombras la colección, cámbialo también en la tarjeta (grupo Colecciones)." }
              - { name: portada_texto_es, label: "Portada · texto de entrada", widget: text, required: false }
              - { name: portada_boton_es, label: "Portada · botón de volver", widget: string, required: false }
              - { name: historia_eyebrow_es, label: "Historia · línea pequeña", widget: string, required: false }
              - { name: historia_titulo_es, label: "Historia · título", widget: string, required: false }
              - { name: historia_p1_es, label: "Historia · párrafo 1", widget: text, required: false, hint: "Puedes usar <strong>negrita</strong> y <em>cursiva</em> si quieres resaltar algo." }
              - { name: historia_p2_es, label: "Historia · párrafo 2", widget: text, required: false, hint: "Puedes usar <strong>negrita</strong> y <em>cursiva</em> si quieres resaltar algo." }
              - { name: historia_p3_es, label: "Historia · párrafo 3", widget: text, required: false, hint: "Puedes usar <strong>negrita</strong> y <em>cursiva</em> si quieres resaltar algo." }
              - { name: esperanza_eyebrow_es, label: "Esperanza · línea pequeña", widget: string, required: false }
              - { name: esperanza_titulo_es, label: "Esperanza · título", widget: string, required: false }
              - { name: esperanza_texto_es, label: "Esperanza · texto", widget: text, required: false, hint: "Puedes usar <strong>negrita</strong> y <em>cursiva</em> si quieres resaltar algo." }
              - { name: dato1_numero_es, label: "Cifra 1 · número grande", widget: string, required: false }
              - { name: dato1_texto_es, label: "Cifra 1 · explicación", widget: text, required: false }
              - { name: dato2_numero_es, label: "Cifra 2 · número grande", widget: string, required: false }
              - { name: dato2_texto_es, label: "Cifra 2 · explicación", widget: text, required: false }
              - { name: dato3_numero_es, label: "Cifra 3 · número grande", widget: string, required: false }
              - { name: dato3_texto_es, label: "Cifra 3 · explicación", widget: text, required: false }
              - { name: curiosidad_eyebrow_es, label: "Dato curioso · línea pequeña", widget: string, required: false }
              - { name: curiosidad_titulo_es, label: "Dato curioso · título", widget: string, required: false }
              - { name: curiosidad_p1_es, label: "Dato curioso · párrafo 1", widget: text, required: false }
              - { name: curiosidad_p2_es, label: "Dato curioso · párrafo 2", widget: text, required: false }
              - { name: curiosidad_frase_es, label: "Dato curioso · frase destacada", widget: text, required: false }
